<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sahaj Saliya · Under maintenance</title>
<meta name="description" content="Sahaj Saliya's AI/ML portfolio is being rebuilt. Back soon.">
<meta name="theme-color" content="#04040b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2304040b'/%3E%3Cpath d='M12 32c0-8 10-8 20 0s20 8 20 0-10-8-20 0-20 8-20 0z' fill='none' stroke='%23c4b5ff' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,700&family=Inter:wght@500&display=swap">
<style>
  :root{
    --bg:#04040b; --track:rgba(160,165,200,.14);
    --glow:#6d4dff; --glow-2:#a996ff; --core:#ffffff;
    --text:#f2f2f2; --muted:#7c8099;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--text);
    display:grid;place-items:center;overflow:hidden;
    font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px,env(safe-area-inset-left));
  }
  /* deep space vignette with faint concentric rings */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(circle at 50% 46%, rgba(70,60,190,.22) 0, rgba(30,25,90,.12) 18%, transparent 42%),
      repeating-radial-gradient(circle at 50% 46%, rgba(255,255,255,.018) 0 1px, transparent 1px 46px),
      radial-gradient(circle at 50% 46%, #0b0b20 0, #05050e 45%, #010104 80%);
  }
  main{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:28px}
  .halo{position:absolute;top:2%;left:50%;width:420px;height:300px;max-width:110vw;transform:translateX(-50%);
    background:radial-gradient(closest-side, rgba(109,77,255,.30), transparent);filter:blur(20px);animation:breathe 4.4s ease-in-out infinite}
  #loop{width:min(400px,86vw);aspect-ratio:2/1;display:block;position:relative}
  h1,p{position:relative}
  h1{margin:0;font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-weight:700;
    font-size:clamp(2.1rem,6.4vw,4.2rem);line-height:1.02;letter-spacing:-.03em;font-variation-settings:"opsz" 60;text-wrap:balance}
  p{margin:0;color:var(--muted);font-size:.95rem;letter-spacing:.01em}
  .dots::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.6s steps(4) infinite}
  footer{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#4c5068;font-size:.8rem}
  footer a{color:inherit;text-decoration:none;border-bottom:1px solid rgba(124,128,153,.35)}
  footer a:hover{color:var(--glow-2)}

  @keyframes breathe{0%,100%{opacity:.7;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.08)}}
  @keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
  @media (prefers-reduced-motion:reduce){
    .halo,.dots::after{animation:none}
    .dots::after{content:"..."}
  }
</style>
</head>
<body>
<main>
  <div class="halo" aria-hidden="true"></div>
  <canvas id="loop" role="img" aria-label="Animated infinity loop"></canvas>
  <h1>Website under maintenance</h1>
  <p class="dots">Something new is being built. Back soon</p>
</main>
<footer>Sahaj Saliya · <a href="https://github.com/SahajIVVIX-1">GitHub</a> · <a href="https://www.linkedin.com/in/sahajs59">LinkedIn</a></footer>
<script>
(function(){
  // a comet runs around a lemniscate: thick white core, violet bloom, tail tapering to nothing
  const c=document.getElementById('loop'), x=c.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W,H,dpr;
  function size(){dpr=Math.min(2,devicePixelRatio||1);const r=c.getBoundingClientRect();W=r.width;H=r.height;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
  function pt(t){const s=Math.sin(t),k=1+s*s,a=W*.36;return[W/2+a*Math.cos(t)/k,H/2+a*s*Math.cos(t)/k*1.15]}
  const N=140, TAIL=Math.PI*1.25; // tail covers ~60% of the loop
  function frame(ms){
    const head=reduce?2.3:ms/1000*2.35;
    x.clearRect(0,0,W,H);
    const th=W*.042;
    // faint track
    x.globalCompositeOperation='source-over';x.lineCap='round';x.lineJoin='round';
    x.beginPath();for(let i=0;i<=200;i++){const p=pt(i/200*Math.PI*2);i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1])}
    x.strokeStyle='rgba(150,155,190,.10)';x.lineWidth=th;x.stroke();
    x.globalCompositeOperation='lighter';
    const pts=[];for(let i=0;i<=N;i++){const f=i/N;pts.push([pt(head-TAIL*(1-f)),f])}
    // three passes: wide bloom, violet glow, white core
    const passes=[[3.4,'110,80,255',.07],[1.7,'150,125,255',.16],[.62,'255,255,255',.9]];
    for(const[wm,rgb,al] of passes){
      for(let i=1;i<pts.length;i++){
        const[p0]=pts[i-1],[p1,f]=pts[i], e=Math.pow(f,1.6);
        x.strokeStyle='rgba('+rgb+','+(al*e)+')';x.lineWidth=th*wm*(.12+.88*Math.pow(f,.7));
        x.beginPath();x.moveTo(p0[0],p0[1]);x.lineTo(p1[0],p1[1]);x.stroke();
      }
    }
    // flaring head
    const h=pts[pts.length-1][0], g=x.createRadialGradient(h[0],h[1],0,h[0],h[1],th*3.2);
    g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.25,'rgba(190,170,255,.55)');g.addColorStop(1,'rgba(90,60,255,0)');
    x.fillStyle=g;x.beginPath();x.arc(h[0],h[1],th*3.2,0,7);x.fill();
    x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=1;
    x.beginPath();x.moveTo(h[0]-th*2.6,h[1]);x.lineTo(h[0]+th*2.6,h[1]);x.moveTo(h[0],h[1]-th*1.6);x.lineTo(h[0],h[1]+th*1.6);x.stroke();
    if(!reduce)requestAnimationFrame(frame);
  }
  size();addEventListener('resize',()=>{size();if(reduce)frame(0)});
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

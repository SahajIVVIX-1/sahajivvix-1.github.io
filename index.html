<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sahaj Saliya · Under maintenance</title>
<meta name="description" content="Sahaj Saliya's AI/ML portfolio is being rebuilt. Back soon.">
<meta name="theme-color" content="#04040b">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,700&family=Inter:wght@500&display=swap">
<style>
  :root{
    --bg:#04040b; --track:rgba(160,165,200,.14);
    --glow:#6d4dff; --glow-2:#a996ff; --core:#ffffff;
    --text:#f2f2f2; --muted:#7c8099;
  }
  *{box-sizing:border-box}
  html{overflow-x:clip}
  html,body{margin:0}
  body{
    background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;overflow-x:hidden;
    font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px,env(safe-area-inset-left));
  }
  /* deep space vignette with faint concentric rings */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(circle at 50% 46%, #0b0b20 0, #05050e 45%, #010104 80%);
  }
  /* concentric rings, faded out around the headline so they never compete with it */
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;
    background:repeating-radial-gradient(circle at 50% 46%, rgba(255,255,255,.02) 0 1px, transparent 1px 46px);
    -webkit-mask-image:radial-gradient(circle at 50% 50%, transparent 0, rgba(0,0,0,.25) 22%, #000 48%);
            mask-image:radial-gradient(circle at 50% 50%, transparent 0, rgba(0,0,0,.25) 22%, #000 48%);
  }
  main,footer{z-index:1}
  main{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:clamp(14px,2.6vh,22px);width:100%;max-width:640px;padding:clamp(32px,8vh,72px) 0 24px}
  .logo{position:relative;display:block;width:min(clamp(76px,20vw,112px),20vh);height:auto;margin-bottom:clamp(6px,2vh,18px);
    filter:drop-shadow(0 10px 24px rgba(0,0,0,.55))}
  #loop{width:clamp(64px,16vw,88px);aspect-ratio:2/1;display:block;position:relative}
  h1,p{position:relative}
  h1{margin:0;font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-weight:700;
    font-size:clamp(1.75rem,7vw,3.4rem);line-height:1.08;letter-spacing:-.03em;font-variation-settings:"opsz" 60;text-wrap:balance;max-width:16ch;overflow-wrap:break-word}
  @media (min-width:700px){h1{max-width:none}}
  p{margin:0;color:var(--muted);font-size:clamp(.85rem,2.6vw,.95rem);letter-spacing:.01em;max-width:44ch;text-wrap:balance}
  .dots::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.6s steps(4) infinite}
  footer{position:relative;padding:16px 0 calc(20px + env(safe-area-inset-bottom));text-align:center;color:#4c5068;font-size:.8rem}
  footer a{color:#6b6f88;text-decoration:none;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;
    padding-bottom:2px;transition:color .25s ease,background-size .3s ease;border-bottom:1px solid rgba(124,128,153,.22)}
  footer a:hover,footer a:focus-visible{color:#c9c6e8;background-size:100% 1px;border-bottom-color:transparent;outline:none}
  @media (prefers-reduced-motion:reduce){footer a{transition:none}}

  @keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
  @media (prefers-reduced-motion:reduce){
    .dots::after{animation:none}
    .dots::after{content:"..."}
  }
</style>
</head>
<body>
<main>
  <img class="logo" src="icon-512.png" width="512" height="512" alt="Sahaj Saliya logo">
  <canvas id="loop" role="img" aria-label="Animated infinity loop"></canvas>
  <h1>Website under maintenance</h1>
  <p class="dots">Something new is being built. Back soon</p>
</main>
<footer>Sahaj Saliya · <a href="https://github.com/SahajIVVIX-1">GitHub</a> · <a href="https://www.linkedin.com/in/sahajs59">LinkedIn</a></footer>
<script>
(function(){
  // a comet runs around a lemniscate: thick white core, violet bloom, tail tapering to nothing
  const c=document.getElementById('loop'), x=c.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W,H,dpr;
  function size(){dpr=Math.min(3,devicePixelRatio||1);const r=c.getBoundingClientRect();W=r.width;H=r.height;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
  function pt(t){const s=Math.sin(t),k=1+s*s,a=W*.31;return[W/2+a*Math.cos(t)/k,H/2+a*s*Math.cos(t)/k*1.15]}
  const N=260, TAIL=Math.PI*1.25; // tail covers ~60% of the loop
  function frame(ms){
    // gentle speed breathing keeps the motion fluid rather than mechanical
    const t=ms/1000, head=reduce?2.3:t*2.1+Math.sin(t*1.05)*.35;
    x.clearRect(0,0,W,H);
    const th=W*.05;
    // faint track
    x.globalCompositeOperation='source-over';x.lineCap='round';x.lineJoin='round';
    x.beginPath();for(let i=0;i<=200;i++){const p=pt(i/200*Math.PI*2);i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1])}
    x.strokeStyle='rgba(150,155,190,.10)';x.lineWidth=th;x.stroke();
    x.globalCompositeOperation='lighter';x.lineCap='butt';
    const pts=[];for(let i=0;i<=N;i++){const f=i/N;pts.push([pt(head-TAIL*(1-f)),f])}
    // three passes: wide bloom, violet glow, white core
    const passes=[[3.4,'110,80,255',.07],[1.7,'150,125,255',.16],[.62,'255,255,255',.9]];
    for(const[wm,rgb,al] of passes){
      for(let i=1;i<pts.length;i++){
        const[p0]=pts[i-1],[p1,f]=pts[i], e=Math.pow(f,1.6);
        x.strokeStyle='rgba('+rgb+','+(al*e)+')';x.lineWidth=th*wm*(.12+.88*Math.pow(f,.7));
        x.beginPath();x.moveTo(p0[0],p0[1]);x.lineTo(p1[0],p1[1]);x.stroke();
      }
    }
    // flaring head
    const h=pts[pts.length-1][0], g=x.createRadialGradient(h[0],h[1],0,h[0],h[1],th*2.6);
    g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.25,'rgba(190,170,255,.55)');g.addColorStop(1,'rgba(90,60,255,0)');
    x.fillStyle=g;x.beginPath();x.arc(h[0],h[1],th*2.6,0,7);x.fill();
        if(!reduce)requestAnimationFrame(frame);
  }
  size();addEventListener('resize',()=>{size();if(reduce)frame(0)});
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

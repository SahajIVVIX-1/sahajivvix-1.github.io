<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 6 80 88" fill="none">
  <defs>
    <!-- Upper Solar Orange Gradient: Brilliant Amber to Electric Tangerine -->
    <linearGradient id="fav-upper-grad" x1="20" y1="12" x2="80" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFA826" />
      <stop offset="45%" stop-color="#FF6200" />
      <stop offset="100%" stop-color="#E54000" />
    </linearGradient>

    <!-- Lower Solar Orange Gradient: Electric Tangerine to Deep Radiant Orange -->
    <linearGradient id="fav-lower-grad" x1="80" y1="88" x2="20" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5200" />
      <stop offset="60%" stop-color="#E03200" />
      <stop offset="100%" stop-color="#C42000" />
    </linearGradient>
  </defs>

  <!-- PURE ORANGE LOGO ONLY - 100% TRANSPARENT BACKGROUND, ZERO BLACK, NO FILTER BLUR -->
  <g id="pure-logo-glyph">
    <!-- Lower Track -->
    <path
      d="M 22 82
         L 62 82
         A 15 15 0 0 0 77 67
         L 77 65
         A 15 15 0 0 0 62 50
         L 38 50"
      stroke="url(#fav-lower-grad)"
      stroke-width="16"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Upper Track -->
    <path
      d="M 78 18
         L 38 18
         A 15 15 0 0 0 23 33
         L 23 35
         A 15 15 0 0 0 38 50
         L 62 50"
      stroke="url(#fav-upper-grad)"
      stroke-width="16"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>

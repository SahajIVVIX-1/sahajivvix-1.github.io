# Publishes info.sahaj.si to gh-pages on every push to the content branch, after the smoke test passes.
# (Pushes made by the hourly Action do not trigger this; it publishes those itself.)
name: deploy

on:
  push:
    branches: [info.sahaj.si]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/info.sahaj.si'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: info.sahaj.si

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Smoke test
        env:
          CHROME: /usr/bin/google-chrome
        run: node scripts/smoke.mjs

      - name: Publish to gh-pages
        env:
          DEPLOY_DEPTH: "1"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/deploy-pages.sh "${{ github.event.head_commit.message && 'push' || 'manual' }} $(git rev-parse --short HEAD)"

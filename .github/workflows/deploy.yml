# Publishes info.sahaj.si to gh-pages on every push to the content branch, after the smoke test passes.
# (Pushes made by the hourly Action do not trigger this; it publishes those itself.)
name: deploy

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/info.sahaj.si'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: info.sahaj.si

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Smoke test
        env:
          CHROME: /usr/bin/google-chrome
        run: node scripts/smoke.mjs

      # Another repo with Pages on and no domain of its own is served at info.sahaj.si/<repo>/ and would replace a
      # same-named path of this site (e.g. a repo called "blog"). Fails, and so emails, when that happens.
      - name: Check no other repo publishes over this site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-pages-paths.mjs

      - name: Publish to gh-pages
        env:
          DEPLOY_DEPTH: "1"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/deploy-pages.sh "${{ github.event.head_commit.message && 'push' || 'manual' }} $(git rev-parse --short HEAD)"

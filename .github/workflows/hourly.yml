# Hourly data refresh for info.sahaj.si.
# Fetches GitHub data, rebuilds the chatbot knowledge base, embeddings and Q&A bank, and commits
# to info.sahaj.si only when something changed. It never touches gh-pages or deploys anything.
name: hourly-data

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [info.sahaj.si]
    paths: ["content/**", "scripts/**", "package.json"]

permissions:
  contents: write

concurrency:
  group: hourly-data
  cancel-in-progress: false

jobs:
  refresh:
    # Only ever runs on the content branch, even if a manual dispatch picks another ref.
    if: github.ref == 'refs/heads/info.sahaj.si'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: info.sahaj.si

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: models-minilm-q8-clip-b32-v1

      # fetch-github.mjs keeps the previous files if the API call fails, so this step never breaks the run.
      - name: Fetch GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-github.mjs

      # WATERMARK_KEY marks a few chatbot answers invisibly; without it the existing marks are kept as they are.
      - name: Build knowledge base, embeddings, Q&A bank, pages and build manifest
        env:
          WATERMARK_KEY: ${{ secrets.WATERMARK_KEY }}
        run: node scripts/build.mjs --embed

      # Prints /resume/ to assets/resume/Sahaj-Saliya-Resume.pdf with the runner's Chrome, only when it changed.
      - name: Resume PDF
        env:
          CHROME: /usr/bin/google-chrome
        run: node scripts/resume-pdf.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data index.html 404.html blogs blog resume assets/resume sitemap.xml robots.txt site.webmanifest
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(data): hourly refresh"
            git push origin HEAD:info.sahaj.si
          fi
